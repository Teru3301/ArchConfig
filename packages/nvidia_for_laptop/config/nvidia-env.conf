# Переменные окружения для Hyprland (wlroots) на ноутбуке с Intel iGPU + Nvidia dGPU.
# Подключается из hyprland.conf строкой:
#   source = ~/.config/hypr/configs/nvidia-env.conf
#
# Смысл: сессия Hyprland рендерится через Nvidia (иначе wlroots на Optimus
# часто либо не запускается, либо работает с артефактами/тормозами).
# Приложения, которые вы хотите пускать именно на Intel (для экономии
# батареи), запускайте без offload — по умолчанию они и так пойдут на Intel,
# только тяжёлые вещи явно гоните через `nvidia-offload <cmd>`.

env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,0
env = WLR_NO_HARDWARE_CURSORS,1
env = NVD_BACKEND,direct
env = __VK_LAYER_NV_optimus,NVIDIA_only
