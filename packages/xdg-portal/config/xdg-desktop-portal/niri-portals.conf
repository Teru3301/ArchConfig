# Используется, когда $XDG_CURRENT_DESKTOP=niri (niri сам это выставляет
# при запуске через `niri-session` / `niri --session`).
#
# niri реализует захват экрана через протокол wlr-screencopy, поэтому
# ScreenCast и Screenshot ОБЯЗАТЕЛЬНО должны идти через xdg-desktop-portal-wlr.
# default тоже на gtk — xdg-desktop-portal-gnome в системе принципиально
# не держим (см. packages/niri/install.sh и pacman hook, который его сносит),
# так что остальные интерфейсы (Settings, Secret, FileChooser) закрывает gtk.

#[preferred]
#default=gtk
#org.freedesktop.impl.portal.ScreenCast=wlr
#org.freedesktop.impl.portal.Screenshot=wlr

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome

