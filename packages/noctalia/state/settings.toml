config_version = 14

[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.46999998949468136
tint_intensity = 0.25999999418854713

[bar.default]
center = [ "workspaces" ]
end = [
    "tray",
    "spacer_2",
    "clipboard",
    "spacer_2",
    "keyboard_layout",
    "spacer_2",
    "battery",
    "spacer_2",
    "clock",
    "spacer_2",
    "notifications"
]
margin_ends = 0
radius = 47
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "launcher", "spacer_2", "sysmon", "spacer_2", "volume", "brightness", "spacer_2", "network" ]
thickness = 20

[control_center]
hidden_tabs = [ "weather" ]
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "wifi"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@eDP-2", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 854.0
    cy = 885.0
    output = "eDP-1"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 128.0
    box_width = 810.0
    cx = 853.5
    cy = 901.5
    output = "eDP-2"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 144.0
    box_width = 400.0
    cx = 853.5
    cy = 197.5
    output = "eDP-2"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"

[osd.kinds]
media = false

[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

[shell]
avatar_path = "/home/teru/D/Media/Images/Pictures/геншин/сборки/слюни/0fHb-xqgm_E.jpg"
lang = "ru"

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    launcher_position = "top_left"
    open_near_click_clipboard = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    session_position = "top_right"

    [shell.session]
    grid = true
    grid_columns = 5
    show_shortcuts = false

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "qt" ]
    community_ids = [ "telegram", "fastfetch", "bat" ]

[wallpaper]
directory = "/home/teru/D/Media/Images/Wallpapers"
directory_dark = "/home/teru/D/Media/Images/Wallpapers"
directory_light = "/home/teru/D/Media/Images/Wallpapers"

    [wallpaper.default]
    path = "/home/teru/D/Media/Images/Wallpapers/pasted file.png"

    [wallpaper.last]
    path = "/home/teru/D/Media/Images/Wallpapers/pasted file.png"

    [wallpaper.monitors.eDP-2]
    path = "/home/teru/D/Media/Images/Wallpapers/pasted file.png"

    [[wallpaper.favorite]]
    builtin_palette = "Tokyo-Night"
    palette_source = "builtin"
    path = "/home/teru/D/Media/Images/Wallpapers/pasted file.png"
    theme_mode = "dark"

[widget.battery]
interactive = false

[widget.brightness.actions]
left = "none"
middle = "none"

[widget.clock]
format = "{:%d %h %Y   %H:%M}"

[widget.launcher]
glyph = "brand-amigo"

[widget.session]
color = "error"

[widget.spacer_2]
type = "spacer"

[widget.workspaces]
empty_color = "surface"
occupied_color = "surface"